<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>α–β Urban Base Substrate</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #fafafa;
    }
    #controls {
      padding: 10px;
      background: #fff;
      border-bottom: 1px solid #ccc;
    }
    label {
      margin-right: 20px;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

  <div id="controls">
    <label>
      α:
      <input id="alpha" type="range" min="-5" max="5" step="0.01" value="0.5">
      <span id="alphaVal">0.5</span>
    </label>

    <label>
      β:
      <input id="beta" type="range" min="-0.7" max="0" step="0.01" value="-0.3">
      <span id="betaVal">-0.3</span>
    </label>
  </div>

  <canvas id="canvas"></canvas>

  <script src="main.js"></script>
</body>
</html>
